# Three-platform offline gate (plan row 18; Phase 1 gate names Windows, Linux and macOS).
# Written 2026-09-13. The offline suite runs with Python IP networking denied; the inventory
# audit checks that the runtime stays standard-library only. Until a run is recorded, the
# three-platforms case stays pending.
name: offline-tests
on:
  push:
    branches: [master, 'lumen/**']
  pull_request:

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version && python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - run: python tools/inventory.py
      - run: python tools/offline-tests.py
      - run: python -m pip wheel --no-index --find-links artifacts/local/wheels --no-deps --wheel-dir dist .
      - run: python tools/verify-install.py
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/local/clean-install.json
